name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily (06:00 EAT, low-traffic)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump Supabase database
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::SUPABASE_DIRECT_URL secret is not set. See docs/08-DATABASE-BACKUPS.md."
            exit 1
          fi
          mkdir -p backup
          docker run --rm -v "$PWD/backup:/backup" postgres:17 \
            pg_dump "$DIRECT_URL" --no-owner --no-acl -Fc \
            -f "/backup/movec-$(date -u +%Y-%m-%d_%H%M%S).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 90
