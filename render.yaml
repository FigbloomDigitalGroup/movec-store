services:
  - type: web
    name: movec-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # ── Set these manually in the Render dashboard ──────────────────
      # Database now lives on Supabase, not Render — see docs/07-SUPABASE-MIGRATION.md
      # DATABASE_URL             (Supabase pooled connection, port 6543, ?pgbouncer=true)
      # DIRECT_URL               (Supabase direct connection, port 5432 — used by `prisma migrate`)
      # JWT_SECRET
      # JWT_REFRESH_SECRET
      # JWT_EXPIRATION          (e.g. 15m)
      # JWT_REFRESH_EXPIRATION  (e.g. 7d)
      # CLOUDINARY_CLOUD_NAME
      # CLOUDINARY_API_KEY
      # CLOUDINARY_API_SECRET
      # Paybill/Till numbers are set from the admin panel (Payment Settings), not env vars.
      # BREVO_API_KEY
      # BREVO_FROM_EMAIL
      # BREVO_FROM_NAME
      # AUTO_VERIFY_EMAIL       (false)
      # FRONTEND_URL            (https://your-app.vercel.app)
