services:
  - type: web
    name: movec-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 4000
      # ── Set these manually in the Render dashboard ──────────────────
      # DATABASE_URL             (Supabase pooled connection, port 6543, ?pgbouncer=true)
      # DIRECT_URL               (Supabase direct connection, port 5432, used for prisma migrate)
      # JWT_SECRET
      # JWT_REFRESH_SECRET
      # JWT_EXPIRATION          (e.g. 15m)
      # JWT_REFRESH_EXPIRATION  (e.g. 7d)
      # CLOUDINARY_CLOUD_NAME
      # CLOUDINARY_API_KEY
      # CLOUDINARY_API_SECRET
      # PAYSTACK_SECRET_KEY
      # PAYSTACK_PUBLIC_KEY
      # MPESA_CONSUMER_KEY
      # MPESA_CONSUMER_SECRET
      # MPESA_PASSKEY
      # MPESA_SHORTCODE
      # MPESA_CALLBACK_URL      (update to https://movec-api.onrender.com/payments/mpesa/callback)
      # BREVO_API_KEY
      # BREVO_FROM_EMAIL
      # BREVO_FROM_NAME
      # AUTO_VERIFY_EMAIL       (false)
      # FRONTEND_URL            (https://your-app.vercel.app)
